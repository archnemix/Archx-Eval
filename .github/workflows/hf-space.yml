name: hf-space

# Deploys the relay to the Hugging Face Space. Triggered by editing this one
# file, so deploys are explicit and auditable rather than a side effect of a
# normal commit.
on:
  push:
    paths:
      - 'ci/trigger/space.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hf-space-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (upload relay to the Space)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the HF client
        run: pip install --quiet "huggingface_hub>=0.24,<1"

      - name: Verify secrets are present (never printed)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          mkdir -p ci/logs ci/outputs
          missing=0
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN secret is not set"; missing=1; fi
          if [ -z "$HF_SPACE" ]; then echo "::error::HF_SPACE variable is not set (e.g. Archnemix/Archx-Eval)"; missing=1; fi
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "HF_TOKEN present (length ${#HF_TOKEN})" | tee ci/logs/space-verify.txt
          echo "target space: $HF_SPACE" | tee -a ci/logs/space-verify.txt

      - name: Upload the relay to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee ci/logs/space-deploy.txt
          import os, pathlib, shutil, tempfile
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space = os.environ["HF_SPACE"]
          api = HfApi(token=token)

          # Stage exactly what the Space needs: the relay source at the repo
          # root, plus the Space README carrying the docker sdk frontmatter.
          stage = pathlib.Path(tempfile.mkdtemp())
          shutil.copytree("relay", stage / "src")
          for item in (stage / "src").iterdir():
              shutil.move(str(item), str(stage / item.name))
          shutil.rmtree(stage / "src")
          shutil.copy("deploy/space-README.md", stage / "README.md")

          # Strip things that must not ship.
          for junk in ("testdata", "scripts", "Makefile", ".dockerignore"):
              p = stage / junk
              if p.is_dir():
                  shutil.rmtree(p)
              elif p.exists():
                  p.unlink()

          files = sorted(str(p.relative_to(stage)) for p in stage.rglob("*") if p.is_file())
          print(f"staging {len(files)} files for {space}:")
          for f in files:
              print("  -", f)

          api.create_repo(repo_id=space, repo_type="space", exist_ok=True, private=True)
          api.upload_folder(
              folder_path=str(stage),
              repo_id=space,
              repo_type="space",
              commit_message=f"deploy relay from {os.environ.get('GITHUB_SHA', '')[:7]}",
          )
          print("upload complete")
          PY

      - name: Record the deployment
        run: |
          printf '%s\n' \
            "space: ${{ vars.HF_SPACE }}" \
            "commit: ${{ github.sha }}" \
            "deployed: $(date -u +%FT%TZ)" \
            "status: success" \
            > ci/outputs/space-deploy.txt
          cat ci/outputs/space-deploy.txt

      - name: Commit the deploy log
        run: |
          git config user.name  "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add -A ci
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "ci(space): deploy ${{ github.sha }}"
          git push
