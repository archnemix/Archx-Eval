name: relay

# Triggered by editing a small control file, not by every push. The bot's own
# result commit only touches ci/** so it can never re-trigger the workflow.
on:
  push:
    paths:
      - 'ci/trigger/relay.yml'
  workflow_dispatch:

# The commit-back step needs write access; nothing else does.
permissions:
  contents: write

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.22'

jobs:
  # ---------------------------------------------------------------- test ----
  test:
    name: test (vet + unit + race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: relay/go.mod

      - name: Record environment
        run: |
          mkdir -p ../ci/logs ../ci/outputs
          {
            echo "go:      $(go version)"
            echo "runner:  ${{ runner.os }} / ${{ runner.arch }}"
            echo "cpus:    $(nproc)"
            echo "memory:  $(free -h | awk '/Mem:/{print $2}')"
            echo "commit:  ${{ github.sha }}"
            echo "branch:  ${{ github.ref_name }}"
            echo "started: $(date -u +%FT%TZ)"
          } | tee ../ci/logs/environment.txt

      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo '::error::files need gofmt'; exit 1; }

      - name: go vet
        run: |
          set -o pipefail
          set +e
          go vet ./... 2>&1 | tee ../ci/logs/vet.txt
          echo "$?" > ../ci/outputs/vet-exit-code.txt

      # CGO_ENABLED=1 is required by the race detector. Setting it here rather
      # than workflow-wide keeps the release build static while still letting
      # CI run the detector.
      # Outcomes are captured rather than aborting, because the log is the
      # deliverable: a failing suite must still be committed so it can be read.
      - name: go test (race)
        env:
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          set +e
          go test ./... -count=1 -race -v 2>&1 | tee ../ci/logs/test.txt
          echo "$?" > ../ci/outputs/test-exit-code.txt

      - name: go test (coverage)
        env:
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          set +e
          go test ./... -count=1 -coverprofile=../ci/outputs/coverage.out 2>&1 \
            | tee -a ../ci/logs/test.txt
          go tool cover -func=../ci/outputs/coverage.out | tee ../ci/outputs/coverage.txt

      - name: Assert the suite really ran and passed
        run: |
          count=$(grep -c '^=== RUN' ../ci/logs/test.txt || true)
          code=$(cat ../ci/outputs/test-exit-code.txt 2>/dev/null || echo 1)
          vet=$(cat ../ci/outputs/vet-exit-code.txt 2>/dev/null || echo 1)
          echo "test cases executed: $count"
          echo "test exit code:      $code"
          echo "vet exit code:       $vet"
          if [ "$count" -lt 40 ]; then
            echo "::error::only $count test cases ran; expected the full suite"
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "::error::the test suite failed (exit $code)"
            exit 1
          fi
          if [ "$vet" != "0" ]; then
            echo "::error::go vet failed (exit $vet)"
            exit 1
          fi

      - name: Build binary
        run: |
          set -o pipefail
          go build -trimpath -ldflags="-s -w -X github.com/archnemix/archx-eval/relay/internal/core.Version=${{ github.sha }}" -o ../ci/outputs/relayd ./cmd/relayd
          ls -l ../ci/outputs/relayd | tee -a ../ci/logs/environment.txt
          ../ci/outputs/relayd -print-config | tee ../ci/outputs/resolved-config.txt

      - name: Upload logs for the collect job
        uses: actions/upload-artifact@v4
        with:
          name: relay-test-logs
          path: |
            ci/logs/test.txt
            ci/logs/vet.txt
            ci/logs/environment.txt
            ci/outputs/coverage.out
            ci/outputs/coverage.txt
            ci/outputs/test-exit-code.txt
            ci/outputs/vet-exit-code.txt
            ci/outputs/binary.txt
            ci/outputs/resolved-config.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # --------------------------------------------------------------- smoke ----
  smoke:
    name: smoke (real HTTP, no mocks)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: relay/go.mod

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null

      - name: Run end-to-end smoke test
        run: |
          set -o pipefail
          set +e
          bash relay/scripts/smoke.sh 2>&1 | tee ci/logs/smoke.txt
          echo "$?" > ci/outputs/smoke-exit-code.txt

      - name: Assert the smoke test passed
        run: |
          code=$(cat ci/outputs/smoke-exit-code.txt 2>/dev/null || echo 1)
          fails=$(grep -c '  FAIL  ' ci/logs/smoke.txt || true)
          echo "smoke exit: $code, failed checks: $fails"
          [ "$code" = "0" ] && [ "$fails" = "0" ] || { echo "::error::smoke test failed"; exit 1; }

      - name: Upload logs for the collect job
        uses: actions/upload-artifact@v4
        with:
          name: relay-smoke-logs
          path: |
            ci/logs/smoke.txt
            ci/outputs/smoke-exit-code.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # --------------------------------------------------------- image build ----
  image:
    name: image (static build + container)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: |
          mkdir -p ci/logs
          docker build -t archx-eval-relay:ci relay 2>&1 | tee ci/logs/docker-build.txt
          docker image inspect archx-eval-relay:ci --format '{{.Size}} bytes' | tee ci/outputs/image-size.txt

      - name: Verify the image serves traffic
        run: |
          set +e
          docker run -d --name relay-ci -p 8081:7860 \
            -e RELAY_SALT=ci-salt -e ALLOW_LOOPBACK=1 \
            -e ACCESS_TOKEN=ci-token -e ADMIN_TOKEN=ci-admin \
            -v "$PWD/relay/testdata/bank:/app/bank:ro" \
            archx-eval-relay:ci
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8081/health >/dev/null; then break; fi
            sleep 0.5
          done
          {
            echo "== health =="
            curl -s http://127.0.0.1:8081/health | jq .
            echo "== draw =="
            curl -s -H 'Content-Type: application/json' -H 'Authorization: Bearer ci-token' \
              -d '{"categories":["python"],"size":3,"device":{"machine_id":"4c4c4544-0044-3510-8054-b4c04f4e4e32","disk_uuid":"9f1b2c3d4e5f60718293a4b5c6d7e8f9","os_family":"linux","arch":"x86_64"}}' \
              http://127.0.0.1:8081/v1/draw | jq '{count, by_category, shortfall}'
            echo "== second draw (expect 429) =="
            curl -s -o /dev/null -w 'status=%{http_code}\n' -H 'Content-Type: application/json' -H 'Authorization: Bearer ci-token' \
              -d '{"categories":["python"],"size":3,"device":{"machine_id":"4c4c4544-0044-3510-8054-b4c04f4e4e32","disk_uuid":"9f1b2c3d4e5f60718293a4b5c6d7e8f9","os_family":"linux","arch":"x86_64"}}' \
              http://127.0.0.1:8081/v1/draw
          } 2>&1 | tee ci/logs/docker-run.txt
          docker rm -f relay-ci

      - name: Assert the container answered correctly
        run: |
          grep -q '"ok": true' ci/logs/docker-run.txt || { echo "::error::container health check failed"; exit 1; }
          grep -q 'status=429' ci/logs/docker-run.txt || { echo "::error::window enforcement failed inside the container"; exit 1; }
          echo "container behaviour verified"

      - name: Upload logs for the collect job
        uses: actions/upload-artifact@v4
        with:
          name: relay-image-logs
          path: |
            ci/logs/docker-build.txt
            ci/logs/docker-run.txt
            ci/outputs/image-size.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # ------------------------------------------------------------- collect ----
  # Single writer. Pulls every job's artefacts and commits them into the repo
  # under ci/, so nothing depends on GitHub's artifact storage being readable
  # from outside. Runs even when an earlier job failed.
  collect:
    name: collect (commit results into ci/)
    needs: [test, smoke, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: ci/_incoming

      - name: Merge artefacts into ci/
        run: |
          mkdir -p ci/logs ci/outputs
          if [ -d ci/_incoming ]; then
            for d in ci/_incoming/*/; do
              [ -d "$d" ] || continue
              for sub in logs outputs; do
                [ -d "${d}${sub}" ] || continue
                cp -f "${d}${sub}"/* "ci/${sub}/" 2>/dev/null || true
              done
            done
          fi
          rm -rf ci/_incoming
          # Never keep a build artefact in git; record its fingerprint instead.
          if [ -f ci/outputs/relayd ]; then
            { echo "binary_sha256: $(sha256sum ci/outputs/relayd | cut -d' ' -f1)"
              echo "binary_bytes:  $(stat -c%s ci/outputs/relayd)"
              echo "go_version:    $(head -1 ci/logs/environment.txt 2>/dev/null || echo unknown)"
            } > ci/outputs/binary.txt
            rm -f ci/outputs/relayd
          fi
          printf '%s\n' \
            "job: ${{ github.job }}" \
            "run: ${{ github.run_id }}" \
            "commit: ${{ github.sha }}" \
            "branch: ${{ github.ref_name }}" \
            "finished: $(date -u +%FT%TZ)" \
            "test: ${{ needs.test.result }}" \
            "smoke: ${{ needs.smoke.result }}" \
            "image: ${{ needs.image.result }}" \
            > ci/outputs/run-summary.txt
          smoke_checks=$(grep -c '  PASS  ' ci/logs/smoke.txt 2>/dev/null) || smoke_checks=0
          smoke_failures=$(grep -c '  FAIL  ' ci/logs/smoke.txt 2>/dev/null) || smoke_failures=0
          test_cases=$(grep -c '^=== RUN' ci/logs/test.txt 2>/dev/null) || test_cases=0
          printf '%s\n' \
            "smoke_checks=$smoke_checks" \
            "smoke_failures=$smoke_failures" \
            "test_cases=$test_cases" \
            >> ci/outputs/run-summary.txt

          echo "== ci tree =="
          find ci -type f -not -path 'ci/trigger/*' | sort
          echo "== summary =="
          cat ci/outputs/run-summary.txt

      - name: Verify the secret is present (never printed)
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::warning::HF_TOKEN is not set; the dataset publish step will be skipped"
          else
            echo "HF_TOKEN present (length ${#HF_TOKEN}); value never printed"
          fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Commit results
        run: |
          git config user.name  "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add -A ci
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "ci(relay): run ${{ github.run_id }} results

          test=${{ needs.test.result }} smoke=${{ needs.smoke.result }} image=${{ needs.image.result }}"
          git push
