[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archx-eval"
version = "0.1.0"
description = "Front runner for Archx-Eval: draw questions, ask a model, report answers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Archx" }]
dependencies = []

[project.optional-dependencies]
gguf = ["llama-cpp-python>=0.2.90"]
dev = ["pytest>=8"]

[project.scripts]
archx-eval = "archx_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["archx_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
